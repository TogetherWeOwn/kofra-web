name: deploy

# DISABLED. Nothing is deployed until the owner approves a launch. The job
# below is hard-off (`if: false`); turning it on takes a reviewed PR that
# also splits build from deploy (no secrets during the build), records the
# active version for rollback, and fills the production Worker names from
# the protected `production` environment instead of the placeholder names
# in each app's wrangler.jsonc.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (disabled)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Each app's build points wrangler at the adapter output, so a plain
      # `wrangler deploy` in the app directory ships that build.
      - name: Deploy the Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for app in apps/site apps/console; do
            (cd "$app" && pnpm exec wrangler deploy)
          done
